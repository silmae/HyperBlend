# Create environment with conda running:
# conda env create -n hb --file hb_env.yml
# Change "create" to "update" when updating.
name: hb
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
#  - Pillow
  - scipy
  - matplotlib
  - toml
  - ipython
  - sphinx #API documentation
  - cpuonly # disables pytorch CUDA that interferes with Blender's CUDA rendering (.dll loading errors)
  - pytorch
  - pip
  - pip: 
      - sphinx-rtd-theme # shpinx theme
#      - myst-parser # for parsing Markdown files to sphinx documentation
#      - sphinxcontrib-bibtex # sphinx bibtex extension for citing
      - spectral # for image cube read and write
      - spectres # for resampling spectra
      - Pillow
      - black # for code formatting
      - "pandas[excel]"
